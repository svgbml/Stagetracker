<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagetracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f3f4f6; --pane:#ffffff; --side:#f7f8fa; --hover:#f1f3f6; --sel:#e8f0fe; --sel-bar:#1a66d6;
  --text:#1f2328; --muted:#5f6b7a; --faint:#8b95a3; --line:#e4e7ec; --line-strong:#cfd5dd;
  --accent:#1a66d6; --accent-soft:#e8f0fe; --accent-text:#1557b0;
  --danger:#c4321f; --danger-soft:#fdecea; --warn:#9a5b00; --warn-soft:#fff3d6; --ok:#137333; --ok-soft:#e6f4ea;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418; --pane:#1a1e24; --side:#15191e; --hover:#222830; --sel:#1d2b42; --sel-bar:#6ea2ff;
  --text:#e6e9ee; --muted:#a1abb8; --faint:#76808d; --line:#2a3039; --line-strong:#3a424d;
  --accent:#6ea2ff; --accent-soft:#1d2b42; --accent-text:#9cc0ff;
  --danger:#ff8a7a; --danger-soft:#3a1f1c; --warn:#f2c46b; --warn-soft:#3a2f17; --ok:#7dd69a; --ok-soft:#173523;
}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ti{font-size:16px;vertical-align:-3px}

.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--pane);border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;width:206px;display:flex;align-items:center;gap:8px}
.brand i{color:var(--accent);font-size:20px}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:8px;background:var(--hover);border:1px solid transparent;border-radius:999px;padding:0 14px;height:36px}
.search:focus-within{background:var(--pane);border-color:var(--accent)}
.search input{flex:1;border:0;background:none;outline:none;height:100%}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--pane);padding:6px 12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.btn{border:1px solid var(--line-strong);background:var(--pane);border-radius:var(--r);padding:6px 12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1220}}
.btn.sm{padding:3px 9px;font-size:12px}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}

.main{display:grid;grid-template-columns:220px minmax(0,1fr) 400px;min-height:0}
.side{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
.side h4{margin:14px 10px 4px;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--text);text-align:left}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--accent-text);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.nav .n.red{color:var(--danger);font-weight:600}
.nav.drop{outline:2px dashed var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.mid{display:flex;flex-direction:column;min-height:0;background:var(--pane);border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);min-height:42px}
.bar .title{font-weight:600;font-size:14px;margin-right:8px}
.bar .sp{flex:1}
.bar select{border:1px solid var(--line);background:var(--pane);border-radius:6px;padding:3px 6px;color:var(--muted)}
.list{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:22px 150px minmax(0,1fr) auto 74px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sel-bar)}
.row.unread .org,.row.unread .fn{font-weight:700}
.row input{margin:0}
.org{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-weight:400}
.date{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.late{color:var(--danger)!important;font-weight:600}
.soon{color:var(--warn)!important;font-weight:600}
.lbl{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;vertical-align:1px}
.st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;white-space:nowrap;background:var(--hover);color:var(--muted)}
.st-nieuw{background:var(--accent-soft);color:var(--accent-text)}
.st-gesolliciteerd{background:var(--ok-soft);color:var(--ok)}
.st-gesprek{background:var(--warn-soft);color:var(--warn)}
.st-aangenomen{background:var(--ok);color:var(--pane)}
.st-afgewezen{background:var(--danger-soft);color:var(--danger)}
.hint{padding:10px 12px;color:var(--faint);font-size:12px}
kbd{border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;font:11px var(--font);color:var(--muted);background:var(--pane)}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty i{font-size:32px;display:block;margin-bottom:8px;color:var(--faint)}

.board{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(165px,1fr));gap:10px;padding:10px;align-items:start;background:var(--bg)}
.col{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col.drop,.zone.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.colh{display:flex;justify-content:space-between;font-weight:600;padding:2px 4px}
.colh span{color:var(--muted);font-weight:400}
.card{background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.card:hover{border-color:var(--line-strong)}
.card.sel{box-shadow:0 0 0 2px var(--accent)}
.card .t{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.card .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.zone{border:1px dashed var(--line-strong);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px}
.zone h5{margin:0;font-size:11px;color:var(--muted);font-weight:600;padding:0 2px}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.av.lg{width:34px;height:34px;font-size:12px}

.detail{background:var(--pane);overflow:auto;min-height:0}
.dhead{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dhead input.big{font-size:18px;font-weight:600;border:0;background:none;width:100%;padding:2px 4px;margin-left:-4px;border-radius:4px}
.dhead input.med{border:0;background:none;width:100%;color:var(--muted);padding:2px 4px;margin-left:-4px;border-radius:4px}
.dhead input:hover,.dhead input:focus{background:var(--hover);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--danger-soft);color:var(--danger)}
.dsec{padding:12px 18px;border-bottom:1px solid var(--line)}
.dsec h5{margin:0 0 8px;font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.action{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:10px}
.action.late{border-color:var(--danger)}
.fields{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;align-items:center}
.fields label{color:var(--muted);font-size:12px}
.f{width:100%;border:1px solid transparent;background:none;border-radius:6px;padding:4px 6px}
.f:hover{border-color:var(--line)}
.f:focus{border-color:var(--accent);outline:none;background:var(--pane)}
textarea.f{min-height:70px;resize:vertical;border-color:var(--line)}
.inrow{display:flex;gap:6px;align-items:center}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:3px 0;font-size:12px;color:var(--muted)}
.tl li b{font-weight:500;color:var(--text);min-width:70px}
.dfoot{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px}
.back{display:none}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--pane);color:var(--text);width:min(720px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlgh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlgh h2{margin:0;font-size:16px}
.dlgb{padding:6px 18px 18px;overflow:auto;max-height:calc(90vh - 60px)}
.dlgb h3{font-size:13px;margin:16px 0 8px}
.dlgb .in{border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;background:var(--pane);width:100%}
.dlgb textarea.in{min-height:80px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bron{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;margin-bottom:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--pane);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1180px){.main{grid-template-columns:200px minmax(0,1fr) 340px}.row{grid-template-columns:22px 120px minmax(0,1fr) 70px}.row .stc{display:none}}
@media (max-width:860px){
  .brand{width:auto}.brand span{display:none}
  .seg button span,.top .btn.primary span,#icsBtn{display:none}
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}
  .side h4{display:none}.nav{width:auto;white-space:nowrap;flex:none}.nav .n{margin-left:4px}.hint{display:none}.search{padding:0 10px}
  .detail{display:none}
  .app.show-detail .mid{display:none}.app.show-detail .detail{display:block}.app.show-detail .side{display:none}
  .back{display:inline-flex}
  .row{grid-template-columns:20px minmax(0,1fr) 64px}.row .org{display:none}
  .row .fn .orgm{display:inline}
  .board{grid-template-columns:repeat(4,220px)}
  .g2{grid-template-columns:1fr}
}
.orgm{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><i class="ti ti-briefcase"></i><span>Stagetracker</span></div>
    <label class="search"><i class="ti ti-search"></i><input id="q" placeholder="Zoeken of filteren, bijv. label:afstuderen deadline:<30d" autocomplete="off"><button class="icon-btn" id="qClear" title="Wissen" hidden><i class="ti ti-x"></i></button></label>
    <div class="seg" role="tablist">
      <button id="vList" class="on" title="Lijst (V)"><i class="ti ti-list"></i><span>Lijst</span></button>
      <button id="vBoard" title="Pijplijn (V)"><i class="ti ti-layout-columns"></i><span>Pijplijn</span></button>
    </div>
    <button class="btn primary" id="newBtn" title="Nieuwe plek (N)"><i class="ti ti-plus"></i><span>Nieuw</span></button>
    <button class="icon-btn" id="icsBtn" title="Herinneringen naar agenda (.ics)"><i class="ti ti-calendar-down"></i></button>
    <button class="icon-btn" id="setBtn" title="Instellingen"><i class="ti ti-settings"></i></button>
  </header>
  <div class="main">
    <nav class="side" id="side"></nav>
    <section class="mid" id="mid"></section>
    <section class="detail" id="detail"></section>
  </div>
</div>

<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
{
"use strict";
/* ===== constants ===== */
const ST = {
  nieuw:{label:"Nieuw"}, geinteresseerd:{label:"Interesse"}, gesolliciteerd:{label:"Verstuurd"},
  gesprek:{label:"Gesprek"}, aangenomen:{label:"Aangenomen"}, afgewezen:{label:"Afgewezen"}, genegeerd:{label:"Genegeerd"}
};
const OPEN = ["nieuw","geinteresseerd","gesolliciteerd","gesprek"];
const FOLDERS = [
  {id:"nieuw", label:"Nieuw", icon:"ti-inbox", st:["nieuw"]},
  {id:"interesse", label:"Interesse", icon:"ti-star", st:["geinteresseerd"]},
  {id:"verstuurd", label:"Verstuurd", icon:"ti-send", st:["gesolliciteerd"]},
  {id:"gesprek", label:"Gesprek", icon:"ti-users", st:["gesprek"]},
  {id:"resultaat", label:"Resultaat", icon:"ti-circle-check", st:["aangenomen","afgewezen"]},
  {id:"genegeerd", label:"Genegeerd", icon:"ti-archive", st:["genegeerd"]},
  {id:"alles", label:"Alles", icon:"ti-stack-2", st:null}
];
const DROP_STATUS = {nieuw:"nieuw", interesse:"geinteresseerd", verstuurd:"gesolliciteerd", gesprek:"gesprek", genegeerd:"genegeerd"};
const LABELS = [
  {id:"Stage jaar 3", kort:"Stage jr 3", c:"#7F77DD", bg:"#EEEDFE", fg:"#3C3489"},
  {id:"Afstudeerstage", kort:"Afstuderen", c:"#1D9E75", bg:"#E1F5EE", fg:"#085041"},
  {id:"Bijbaan", kort:"Bijbaan", c:"#D85A30", bg:"#FAECE7", fg:"#712B13"},
  {id:"Vacature (na afstuderen)", kort:"Vacature", c:"#888780", bg:"#F1EFE8", fg:"#444441"},
  {id:"Open sollicitatie", kort:"Open sollicitatie", c:"#378ADD", bg:"#E6F1FB", fg:"#0C447C"}
];
const SECTOREN = ["Forensisch","Ziekenhuislab","Onderzoeksinstituut","Universiteit","Industrie / farma","Overheid","Overig"];
const STORE = "stagetracker.v1";
const INBOX_URL = "data/gevonden.json";
const DEFAULT_BRONNEN = [
  {naam:"NFI – werken & stage", url:"https://www.google.com/search?q=NFI+Nederlands+Forensisch+Instituut+stage+hbo"},
  {naam:"Forensische labs (NL)", url:"https://www.google.com/search?q=forensisch+laboratorium+stage+hbo+Nederland"},
  {naam:"Ziekenhuislabs Brabant", url:"https://www.google.com/search?q=ziekenhuis+laboratorium+stage+hbo+Brabant"},
  {naam:"Avans stagebank", url:""},
  {naam:"Magnet.me", url:"https://magnet.me/nl-NL/"},
  {naam:"Indeed – laboratorium stage", url:"https://nl.indeed.com/q-laboratorium-stage-vacatures.html"}
];

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => iso(new Date());
const addDays = (s,n) => { const d = s ? new Date(s+"T00:00") : new Date(); d.setDate(d.getDate()+n); return iso(d); };
const days = d => d ? Math.round((new Date(d+"T00:00") - new Date(today()+"T00:00"))/864e5) : null;
const fmt = (d, long) => d ? new Date(d+"T00:00").toLocaleDateString("nl-NL", long ? {weekday:"short",day:"numeric",month:"short",year:"numeric"} : {day:"numeric",month:"short"}) : "";
const labelOf = id => LABELS.find(l => l.id === id) || {id, kort:id||"–", c:"#888780", bg:"#F1EFE8", fg:"#444441"};
const lblHtml = id => { const l = labelOf(id); return `<span class="lbl" style="background:${l.bg};color:${l.fg}">${esc(l.kort)}</span>`; };
const stHtml = s => `<span class="st st-${s}">${ST[s]?.label || s}</span>`;
const initials = n => (n||"").split(/\s+/).filter(w => w && !/^(van|de|der|den|het|ten|ter)$/i.test(w)).map(w => w[0]).join("").slice(0,2).toUpperCase() || "?";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
const isOpen = it => OPEN.includes(it.status);

/* ===== data ===== */
function blank(){ return {versie:2, items:[], settings:{maxReistijd:90, cvVersies:["cv-v1"], motivatieVersies:["motivatie-algemeen-v1"], bronnen:DEFAULT_BRONNEN}, genegeerd:[]}; }
function migrate(it){
  it = Object.fromEntries(Object.entries(it||{}).filter(([,v]) => v !== undefined));
  const o = Object.assign({id:uid(), organisatie:"", functie:"", soort:"Stage jaar 3", sector:"Forensisch", locatie:"", reistijd:"", deadline:"", start:"", link:"",
    contact:"", contactFunctie:"", contactInfo:"", status:"geinteresseerd", actie:{tekst:"",datum:""}, cv:"", motivatie:"", notities:"",
    toegevoegd:today(), gelezen:true, bron:"handmatig", historie:[]}, it);
  if(!o.actie || typeof o.actie !== "object") o.actie = {tekst:"",datum:""};
  if(o.followUp && !o.actie.datum){ o.actie = {tekst:"Follow-up sturen", datum:o.followUp}; }
  delete o.followUp;
  o.historie = (o.historie||[]).map(h => h.tekst ? h : {datum:h.datum, tekst:`Status: ${ST[h.status]?.label || h.status}`});
  if(!ST[o.status]) o.status = "geinteresseerd";
  return o;
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(STORE)); if(d && Array.isArray(d.items)){ const b = blank(); b.items = d.items.map(migrate); b.settings = Object.assign(b.settings, d.settings||{}); b.genegeerd = d.genegeerd||[]; return b; } }catch(e){}
  return blank();
}
let db = load();
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(db)); }catch(e){ toast("Opslaan mislukt – exporteer je data"); } }
const get = id => db.items.find(i => i.id === id);
function log(it, tekst){ it.historie.unshift({datum:today(), tekst}); }
function setStatus(it, s){
  if(!it || it.status === s) return;
  it.status = s; it.gelezen = true; log(it, `Status: ${ST[s].label}`);
  if(s === "gesolliciteerd" && !it.actie.tekst){ it.actie = {tekst:"Follow-up sturen", datum:addDays(today(),10)}; toast("Volgende actie: follow-up over 10 dagen"); }
  if(!isOpen(it)) it.actie = {tekst:"", datum:""};
}

/* ===== state ===== */
const ui = {view:"list", folder:"nieuw", label:null, smart:null, q:"", sel:null, checked:new Set(), sort:"deadline"};
try{ Object.assign(ui, JSON.parse(localStorage.getItem(STORE+".ui")||"{}"), {checked:new Set(), q:""}); }catch(e){}
function saveUi(){ try{ localStorage.setItem(STORE+".ui", JSON.stringify({view:ui.view, folder:ui.folder, label:ui.label, smart:ui.smart, sort:ui.sort})); }catch(e){} }
if(!db.items.some(i => i.status === "nieuw") && ui.folder === "nieuw" && db.items.length) ui.folder = "interesse";

/* ===== filtering ===== */
function parseQuery(q){
  const f = {text:[], label:null, status:null, plaats:null, sector:null, deadline:null, reistijd:null};
  q.trim().split(/\s+/).filter(Boolean).forEach(tok => {
    const m = tok.match(/^(label|status|plaats|sector|deadline|reistijd):(.+)$/i);
    if(!m){ f.text.push(tok.toLowerCase()); return; }
    const k = m[1].toLowerCase(), v = m[2].toLowerCase();
    if(k === "deadline" || k === "reistijd"){ const n = parseInt(v.replace(/[^\d]/g,"")); if(!isNaN(n)) f[k] = n; }
    else f[k] = v;
  });
  return f;
}
function matchQuery(it, f){
  if(f.label && !(labelOf(it.soort).kort.toLowerCase().includes(f.label) || it.soort.toLowerCase().startsWith(f.label))) return false;
  if(f.status && !(`${it.status} ${ST[it.status].label}`.toLowerCase().includes(f.status))) return false;
  if(f.plaats && !it.locatie.toLowerCase().includes(f.plaats)) return false;
  if(f.sector && !it.sector.toLowerCase().includes(f.sector)) return false;
  if(f.deadline != null){ const d = days(it.deadline); if(d == null || d > f.deadline) return false; }
  if(f.reistijd != null && !(Number(it.reistijd) <= f.reistijd)) return false;
  const hay = `${it.organisatie} ${it.functie} ${it.locatie} ${it.contact} ${it.notities} ${it.actie.tekst}`.toLowerCase();
  return f.text.every(t => hay.includes(t));
}
function actieDue(it){ return isOpen(it) && it.actie.datum ? days(it.actie.datum) : null; }
function smartMatch(it, s){
  const d = actieDue(it);
  if(s === "telaat") return d != null && d < 0;
  if(s === "week") return d != null && d >= 0 && d <= 7 || (isOpen(it) && ["nieuw","geinteresseerd"].includes(it.status) && it.deadline && days(it.deadline) >= 0 && days(it.deadline) <= 7);
  return true;
}
function baseFilter(){
  const f = parseQuery(ui.q);
  return db.items.filter(it => matchQuery(it, f) && (!ui.label || it.soort === ui.label));
}
function visible(){
  let arr = baseFilter();
  if(ui.smart) arr = arr.filter(it => smartMatch(it, ui.smart));
  else { const fo = FOLDERS.find(x => x.id === ui.folder); if(fo && fo.st) arr = arr.filter(it => fo.st.includes(it.status)); }
  const key = it => ui.sort === "deadline" ? (it.deadline || "9999") : ui.sort === "actie" ? (it.actie.datum || "9999") : ui.sort === "org" ? it.organisatie.toLowerCase() : ui.sort === "reistijd" ? (Number(it.reistijd)||9999) : (it.toegevoegd||"");
  arr.sort((a,b) => { const x = key(a), y = key(b); const r = x > y ? 1 : x < y ? -1 : 0; return ui.sort === "toegevoegd" ? -r : r; });
  return arr;
}

/* ===== render: list ===== */

      ${arr.length ? `<div class="hint"><kbd>J</kbd> <kbd>K</kbd> volgende/vorige · <kbd>X</kbd> selecteren · <kbd>E</kbd> negeren · <kbd>1</kbd>–<kbd>5</kbd> status · <kbd>/</kbd> zoeken · <kbd>?</kbd> alle sneltoetsen</div>` : ""}

  $("#sort").value = ui.sort;

function emptyState(){
  if(ui.q || ui.label || ui.smart) return `<div class="empty"><i class="ti ti-filter-off"></i>Niets gevonden met deze filters.</div>`;
  if(ui.folder === "nieuw") return `<div class="empty"><i class="ti ti-inbox"></i>Geen nieuwe vondsten.<br><span class="sub">De wekelijkse scan zet hier nieuwe plekken neer.</span></div>`;

}
function bulk(kind, val){
  const ids = [...ui.checked]; if(!ids.length) return;
  ids.forEach(id => { const it = get(id); if(!it) return;
    if(kind==="gelezen") it.gelezen = true;
    if(kind==="negeren") setStatus(it, "genegeerd");
    if(kind==="status" && val) setStatus(it, val);
    if(kind==="label" && val){ it.soort = val; log(it, `Label: ${labelOf(val).kort}`); }
  });

function cardHtml(it){

function dropTarget(el, fn){
  el.ondragover = e => { e.preventDefault(); e.stopPropagation(); el.classList.add("drop"); };

}

/* ===== render: detail ===== */

  if(val && !list.some(o => (typeof o === "string" ? o : o.v) === val)) h += `<option selected>${esc(val)}</option>`;

}

/* ===== selection & render ===== */
function select(id){
  ui.sel = id; const it = get(id);
  if(it && !it.gelezen){ it.gelezen = true; save(); }
  $("#app").classList.add("show-detail");
  render(true);
}
function moveSel(dir, keepIdx){
  const arr = ui.view === "board" ? [...$("#mid").querySelectorAll(".card")].map(c=>c.dataset.id) : visible().map(i=>i.id);
  if(!arr.length){ ui.sel = null; return; }
  let i = arr.indexOf(ui.sel);
  if(keepIdx){ const next = arr[i+1] || arr[i-1]; ui.sel = next || null; return; }
  i = i < 0 ? 0 : Math.max(0, Math.min(arr.length-1, i+dir));
  select(arr[i]);
}
function render(keepScroll){
  const list = $("#list"), st = list ? list.scrollTop : 0;
  $("#vList").classList.toggle("on", ui.view==="list"); $("#vBoard").classList.toggle("on", ui.view==="board");
  renderSide(); ui.view === "board" ? renderBoard() : renderList(); renderDetail();
  const nl = $("#list"); if(nl && keepScroll) nl.scrollTop = st;
  document.title = (()=>{ const n = db.items.filter(i=>i.status==="nieuw"&&!i.gelezen).length; return n ? `(${n}) Stagetracker` : "Stagetracker"; })();
}

/* ===== new item ===== */
function newItem(){
  const it = migrate({status:"geinteresseerd", gelezen:true, soort: ui.label || "Stage jaar 3"});
  log(it, "Handmatig toegevoegd");
  db.items.push(it); save();
  ui.q = ""; $("#q").value = "";
  if(ui.view === "list"){ ui.folder = "interesse"; ui.smart = null; }
  select(it.id);
  setTimeout(() => { const f = $('#detail [data-k="functie"]'); f && f.focus(); }, 30);
}

/* ===== inbox from weekly scan ===== */
const keyOf = x => `${(x.organisatie||"").toLowerCase().trim()}|${(x.functie||"").toLowerCase().trim()}`;
function known(x){ const k = keyOf(x); return db.genegeerd.includes(k) || db.items.some(i => keyOf(i) === k || (x.link && i.link === x.link)); }
function ingest(list){
  let n = 0;
  (list||[]).forEach(x => { if(!x || !x.organisatie || known(x)) return;
    const {id:_skip, ...rest} = x;
    const it = migrate({...rest, status:"nieuw", gelezen:false, bron:"scan", toegevoegd:x.gevondenOp||today(), historie:[]});
    it.historie = [{datum:x.gevondenOp||today(), tekst:"Gevonden door wekelijkse scan"}];
    db.items.push(it); n++; });
  if(n){ save(); toast(`${n} nieuwe vondst${n>1?"en":""}`); }
  return n;
}
async function loadInbox(){
  try{ const r = await fetch(INBOX_URL+"?t="+Date.now(), {cache:"no-store"}); if(r.ok){ const d = await r.json(); if(ingest(Array.isArray(d)?d:d.vondsten)) render(true); } }catch(e){}
}

/* ===== ics / export ===== */
function events(){
  const ev = [];
  db.items.forEach(it => { if(!isOpen(it)) return;
    if(it.deadline && ["nieuw","geinteresseerd"].includes(it.status)) ev.push({it, type:"Deadline", datum:it.deadline});
    if(it.actie.tekst && it.actie.datum) ev.push({it, type:it.actie.tekst, datum:it.actie.datum});
  });
  return ev.sort((a,b) => a.datum > b.datum ? 1 : -1);
}
const icsEsc = s => String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g, m=>"\\"+m);
function downloadIcs(ev, name){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//stagetracker//NL","CALSCALE:GREGORIAN"];
  ev.forEach(e => {
    L.push("BEGIN:VEVENT", `UID:${e.it.id}-${e.datum}-${e.type.replace(/\W/g,"").slice(0,20)}@stagetracker`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${e.datum.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${addDays(e.datum,1).replace(/-/g,"")}`, "TRANSP:TRANSPARENT",
      `SUMMARY:${icsEsc(`${e.type}: ${e.it.organisatie} – ${e.it.functie}`)}`,
      `DESCRIPTION:${icsEsc(`${labelOf(e.it.soort).kort} · ${ST[e.it.status].label}\n${e.it.link||""}`)}`,
      ...(e.it.link ? [`URL:${e.it.link}`] : []),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Herinnering","TRIGGER:-P3D","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Herinnering","TRIGGER:-P1D","END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  download(new Blob([L.join("\r\n")], {type:"text/calendar"}), name);
}
function download(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function pickFile(cb){ const f = $("#file"); f.value = ""; f.onchange = () => { const x = f.files[0]; if(x) x.text().then(t => { try{ cb(JSON.parse(t)); }catch(e){ toast("Geen geldige JSON"); } }); }; f.click(); }
function exportCsv(){
  const k = ["organisatie","functie","soort","sector","locatie","reistijd","deadline","start","link","contact","contactFunctie","contactInfo","status","cv","motivatie","notities","toegevoegd"];
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows = db.items.map(i => [...k.map(x => q(x==="status"?ST[i.status].label:i[x])), q(i.actie.tekst), q(i.actie.datum)].join(";"));
  download(new Blob(["\ufeff"+[[...k,"volgendeActie","actieDatum"].join(";"), ...rows].join("\n")], {type:"text/csv"}), `stagetracker-${today()}.csv`);
}

/* ===== dialogs ===== */
function openDlg(html, setup){ const d = $("#dlg"); d.innerHTML = html; d.showModal(); d.querySelectorAll("[data-close]").forEach(b => b.onclick = () => d.close()); setup && setup(d); }
function confirmDlg(msg, okLabel, fn){
  openDlg(`<div class="dlgh"><h2>${esc(msg)}</h2></div><div class="dlgb" style="display:flex;gap:8px;justify-content:flex-end;padding-top:16px"><button class="btn" data-close>Annuleren</button><button class="btn primary" id="ok">${esc(okLabel)}</button></div>`,
    d => d.querySelector("#ok").onclick = () => { d.close(); fn(); });
}
function settingsDlg(){
  const s = db.settings;
  const bronRows = () => s.bronnen.map((b,i) => `<div class="bron"><input class="in" data-bn="${i}" value="${esc(b.naam)}" placeholder="Naam"><input class="in" data-bu="${i}" value="${esc(b.url)}" placeholder="https://"><div class="inrow">${b.url?`<a class="icon-btn" href="${esc(b.url)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i></a>`:""}<button class="icon-btn" data-bd="${i}" title="Verwijderen"><i class="ti ti-x"></i></button></div></div>`).join("");
  openDlg(`<div class="dlgh"><h2>Instellingen</h2><button class="icon-btn" data-close><i class="ti ti-x"></i></button></div>
    <div class="dlgb">
      <h3>Reistijd</h3><div class="g2"><label>Max reistijd enkele reis (min)<input class="in" type="number" id="maxR" min="0" step="5" value="${s.maxReistijd}"></label></div>
      <h3>Documentversies</h3><div class="g2"><label>Cv-versies (één per regel)<textarea class="in" id="cvs">${esc(s.cvVersies.join("\n"))}</textarea></label><label>Motivatiebrieven (één per regel)<textarea class="in" id="mots">${esc(s.motivatieVersies.join("\n"))}</textarea></label></div>
      <h3>Bronnen</h3><div id="bronnen">${bronRows()}</div><button class="btn sm" id="addBron"><i class="ti ti-plus"></i>Bron</button>
      <h3>Data</h3><p class="sub" style="margin:0 0 8px">Je data staat alleen in deze browser. Exporteer als back-up of om op een ander apparaat te importeren.</p>
      <div class="inrow" style="flex-wrap:wrap"><button class="btn sm" id="exp"><i class="ti ti-download"></i>Export JSON</button><button class="btn sm" id="imp"><i class="ti ti-upload"></i>Import JSON</button><button class="btn sm" id="csv"><i class="ti ti-table-export"></i>Export CSV</button><button class="btn sm" id="scanFile"><i class="ti ti-file-import"></i>Scanbestand laden</button><button class="btn sm" id="wipe" style="color:var(--danger)"><i class="ti ti-trash"></i>Alles wissen</button></div>
      <h3>Sneltoetsen</h3>${keysHtml()}
    </div>`, d => {
    const lines = v => v.split("\n").map(x=>x.trim()).filter(Boolean);
    d.querySelector("#maxR").onchange = e => { s.maxReistijd = Number(e.target.value)||0; save(); render(true); };
    d.querySelector("#cvs").onchange = e => { s.cvVersies = lines(e.target.value); save(); render(true); };
    d.querySelector("#mots").onchange = e => { s.motivatieVersies = lines(e.target.value); save(); render(true); };
    const bind = () => {
      d.querySelectorAll("[data-bn]").forEach(x => x.onchange = () => { s.bronnen[+x.dataset.bn].naam = x.value; save(); });
      d.querySelectorAll("[data-bu]").forEach(x => x.onchange = () => { s.bronnen[+x.dataset.bu].url = x.value.trim(); save(); });
      d.querySelectorAll("[data-bd]").forEach(x => x.onclick = () => { s.bronnen.splice(+x.dataset.bd,1); save(); d.querySelector("#bronnen").innerHTML = bronRows(); bind(); });
    }; bind();
    d.querySelector("#addBron").onclick = () => { s.bronnen.push({naam:"",url:""}); save(); d.querySelector("#bronnen").innerHTML = bronRows(); bind(); };
    d.querySelector("#exp").onclick = () => download(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}), `stagetracker-backup-${today()}.json`);
    d.querySelector("#imp").onclick = () => pickFile(x => {
      if(!x || !Array.isArray(x.items)){ toast("Geen geldig back-upbestand"); return; }
      const m = new Map(db.items.map(i=>[i.id,i])); x.items.forEach(i => m.set(i.id, migrate(i)));
      db.items = [...m.values()]; if(x.settings) Object.assign(db.settings, x.settings); if(x.genegeerd) db.genegeerd = [...new Set([...db.genegeerd, ...x.genegeerd])];
      save(); d.close(); render(); toast(`${x.items.length} items geïmporteerd`);
    });
    d.querySelector("#csv").onclick = exportCsv;
    d.querySelector("#scanFile").onclick = () => pickFile(x => { const n = ingest(Array.isArray(x)?x:x.vondsten); d.close(); render(); if(!n) toast("Geen nieuwe vondsten in dit bestand"); });
    d.querySelector("#wipe").onclick = () => confirmDlg("Alle data in deze browser wissen?", "Wissen", () => { db = blank(); ui.sel = null; save(); render(); });
  });
}
function keysHtml(){
  const K = [[["J","K"],"Volgende / vorige plek"],[["X"],"Selecteren"],[["E"],"Negeren"],[["1","2","3","4","5"],"Interesse, Verstuurd, Gesprek, Aangenomen, Afgewezen"],[["U"],"Markeer als ongelezen"],[["N"],"Nieuwe plek"],[["V"],"Lijst / pijplijn"],[["/"],"Zoeken"],[["Esc"],"Zoeken wissen / terug"],[["?"],"Sneltoetsen"]];
  return `<div class="keys">${K.map(([ks,v])=>`<span>${ks.map(x=>`<kbd>${x}</kbd>`).join(" ")}</span><span>${v}</span>`).join("")}</div>
    <p class="sub" style="margin-top:10px">Zoekfilters: <code>label:afstuderen</code> <code>status:gesprek</code> <code>plaats:breda</code> <code>sector:forensisch</code> <code>deadline:&lt;30d</code> <code>reistijd:&lt;60</code></p>`;
}

/* ===== events ===== */
$("#q").oninput = e => { ui.q = e.target.value; $("#qClear").hidden = !ui.q; ui.checked.clear(); renderSide(); ui.view==="board" ? renderBoard() : renderList(); };
$("#qClear").onclick = e => { e.preventDefault(); $("#q").value = ""; ui.q = ""; $("#qClear").hidden = true; render(); };
$("#vList").onclick = () => { ui.view = "list"; saveUi(); render(); };
$("#vBoard").onclick = () => { ui.view = "board"; saveUi(); render(); };
$("#newBtn").onclick = newItem;
$("#setBtn").onclick = settingsDlg;
$("#icsBtn").onclick = () => { const ev = events(); ev.length ? (downloadIcs(ev, "stagetracker-herinneringen.ics"), toast(`${ev.length} items – importeer in Google Agenda`)) : toast("Geen deadlines of acties met datum"); };
document.addEventListener("keydown", e => {
  if($("#dlg").open) return;
  const t = e.target;
  if(t.matches("input,textarea,select")){ if(e.key === "Escape"){ t.blur(); if(t.id === "q"){ t.value=""; ui.q=""; render(); } } return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const it = get(ui.sel), k = e.key.toLowerCase();
  const map = {"1":"geinteresseerd","2":"gesolliciteerd","3":"gesprek","4":"aangenomen","5":"afgewezen"};
  if(k === "j" || e.key === "ArrowDown"){ e.preventDefault(); moveSel(1); }
  else if(k === "k" || e.key === "ArrowUp"){ e.preventDefault(); moveSel(-1); }
  else if(k === "/"){ e.preventDefault(); $("#q").focus(); }
  else if(k === "n"){ e.preventDefault(); newItem(); }
  else if(k === "v"){ ui.view = ui.view === "list" ? "board" : "list"; saveUi(); render(); }
  else if(k === "?"){ openDlg(`<div class="dlgh"><h2>Sneltoetsen</h2><button class="icon-btn" data-close><i class="ti ti-x"></i></button></div><div class="dlgb" style="padding-top:14px">${keysHtml()}</div>`); }
  else if(k === "escape"){ $("#app").classList.remove("show-detail"); }
  else if(!it) return;
  else if(k === "x"){ ui.checked.has(it.id) ? ui.checked.delete(it.id) : ui.checked.add(it.id); renderList(); }
  else if(k === "e"){ setStatus(it, "genegeerd"); save(); moveSel(1, true); render(true); toast("Genegeerd"); }
  else if(k === "u"){ it.gelezen = false; save(); render(true); }
  else if(map[k]){ setStatus(it, map[k]); save(); render(true); toast(ST[map[k]].label); }
});

render();
loadInbox();
}
</script>
</body>
</html>
